<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Chat</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>

    <aside class="sidebar">
        <button class="new-chat-btn" onclick="location.reload()">
            <i class="fas fa-plus"></i>
            New chat
        </button>

        <div class="history-label">History</div>
        <div class="history-list" id="history-list">
            </div>
    </aside>

    <main class="main-content">
        
        <div class="chat-container" id="chat-container">
            <div class="chat-wrapper" id="chat-box">
                <div class="message ai">
                    <div class="avatar"><i class="fas fa-robot"></i></div>
                    <div class="message-content">
                        Hello! I am your AI Document Assistant. <br>
                        Upload a PDF and ask me anything about it.
                    </div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <form id="chat-form" class="input-container">
                <label for="file-upload" id="file-upload-label" title="Attach PDF">
                    <i class="fas fa-paperclip"></i>
                </label>
                <input id="file-upload" type="file" accept=".pdf" style="display: none;">
                
                <span id="file-name" class="file-badge"></span>

                <input type="text" id="question" name="question" placeholder="Send a message..." required autocomplete="off">
                
                <button type="submit" class="send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>

        </div>
    </main>

    <script src="/static/script.js?v=2"></script>
</body>
</html>
